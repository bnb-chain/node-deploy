global:
  scrape_interval: 5s

scrape_configs:
  # reth-bsc validator nodes
  # Ports: 9001 + nodeIndex * 2  (node0=9001, node1=9003, node2=9005, ...)
  - job_name: reth-bsc
    metrics_path: /
    static_configs:
      - targets:
          - 'host.docker.internal:9001'
          - 'host.docker.internal:9003'
          - 'host.docker.internal:9005'
          - 'host.docker.internal:9007'
          - 'host.docker.internal:9009'
        labels:
          cluster: bsc-local

  # geth validator nodes
  # Ports: 6060 + nodeIndex * 2  (node0=6060, node1=6062, node2=6064, ...)
  - job_name: geth
    metrics_path: /debug/metrics/prometheus
    static_configs:
      - targets:
          - 'host.docker.internal:6060'
          - 'host.docker.internal:6062'
          - 'host.docker.internal:6064'
          - 'host.docker.internal:6066'
          - 'host.docker.internal:6068'
        labels:
          cluster: bsc-local
